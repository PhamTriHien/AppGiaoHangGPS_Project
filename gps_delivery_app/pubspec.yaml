name: gps_delivery_app
description: "Hệ thống ứng dụng giao hàng tích hợp định vị GPS đa nền tảng."
# Ngăn việc vô tình xuất bản gói ứng dụng nội bộ lên pub.dev
publish_to: 'none'

# Phiên bản ứng dụng theo định dạng major.minor.patch+build
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Các thư viện phụ thuộc cốt lõi của dự án
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  supabase_flutter: ^2.18.3
  sqflite: ^2.4.4+2
  path: ^1.9.1
  geolocator: ^14.1.1
  intl: ^0.20.3
  uuid: ^4.6.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  sqflite_common_ffi: ^2.4.4
  webview_windows: ^0.4.0
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  web: ^1.1.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  file_selector: ^1.1.0
  crypto: ^3.0.8
  csv: ^8.0.0

# Các thư viện phục vụ kiểm thử và phân tích mã nguồn
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Bật bộ biểu tượng Material Design
  uses-material-design: true

  # Tài nguyên biểu tượng 3D Isometric sinh bởi AI
  assets:
    - assets/icons_3d/
