name: Delivery Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gps_delivery_app/backend/otp-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gps_delivery_app/backend/otp-relay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-acceptance
          path: gps_delivery_app/build/verification/postgres-acceptance.json
          if-no-files-found: ignore

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gps_delivery_app
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --no-pub --no-wasm-dry-run --no-web-resources-cdn

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gps_delivery_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
